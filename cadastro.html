<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | ONG Apoio Solidário</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <header>
    <div class="container cabecalho">
      <a class="marca" href="index.html"><img src="images/logo.svg" alt="Apoio Solidário" width="190" height="48"></a>
      <nav aria-label="Navegação principal">
        <a href="index.html">Início</a>
        <a href="projetos.html">Projetos</a>
        <a href="cadastro.html" aria-current="page">Cadastro</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Cadastro de Voluntário</h1>
    <p>Preencha os campos abaixo para simular um cadastro. Os dados não são enviados.</p>
    <form id="cadastro">
      <fieldset>
        <legend>Dados pessoais</legend>
        <div class="campos">
          <div class="campo">
            <label for="nome">Nome completo</label>
            <input id="nome" type="text" autocomplete="name" minlength="3" required>
          </div>
          <div class="campo">
            <label for="email">E-mail</label>
            <input id="email" type="email" autocomplete="email" required>
          </div>
          <div class="campo">
            <label for="nascimento">Data de nascimento</label>
            <input id="nascimento" type="date" autocomplete="bday" required>
          </div>
          <div class="campo">
            <label for="cpf">CPF</label>
            <input id="cpf" type="text" inputmode="numeric" maxlength="14" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" title="Digite o CPF no formato 000.000.000-00" placeholder="000.000.000-00" required>
          </div>
          <div class="campo">
            <label for="telefone">Telefone</label>
            <input id="telefone" type="tel" autocomplete="tel" inputmode="numeric" maxlength="15" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" title="Digite o telefone no formato (00) 00000-0000" placeholder="(00) 00000-0000" required>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Endereço</legend>
        <div class="campos">
          <div class="campo">
            <label for="cep">CEP</label>
            <input id="cep" type="text" autocomplete="postal-code" inputmode="numeric" maxlength="9" pattern="[0-9]{5}-[0-9]{3}" title="Digite o CEP no formato 00000-000" placeholder="00000-000" required>
          </div>
          <div class="campo">
            <label for="endereco">Endereço</label>
            <input id="endereco" type="text" autocomplete="address-line1" required>
          </div>
          <div class="campo">
            <label for="cidade">Cidade</label>
            <input id="cidade" type="text" autocomplete="address-level2" required>
          </div>
          <div class="campo">
            <label for="estado">Estado</label>
            <select id="estado" autocomplete="address-level1" required>
              <option value="">Selecione</option>
              <option value="RS">RS</option>
              <option value="SC">SC</option>
              <option value="PR">PR</option>
            </select>
          </div>
        </div>
      </fieldset>
      <button type="submit">Enviar cadastro</button>
    </form>
  </main>

  <footer>
    <div class="container">
      <p>ONG Apoio Solidário — projeto acadêmico fictício</p>
      <p>E-mail: <a href="mailto:contato@apoiosolidario.org">contato@apoiosolidario.org</a> | Telefone: <a href="tel:+5551999999999">(51) 99999-9999</a></p>
    </div>
  </footer>
</body>
</html>
